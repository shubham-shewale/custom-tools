[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aquasec-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Aqua Security EU Cloud"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
aquasec-mcp = "aquasec_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aquasec_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"
